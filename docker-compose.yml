# docker-compose.yml
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: streamtools-app
    ports:
      - "3000:3000"
    volumes:
      - streamtools_data:/data
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/data/prod.db
      - SESSION_SECRET=${SESSION_SECRET:-change_this_secret_in_production_12345}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/settings/public"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  streamtools_data:
    name: streamtools_data
